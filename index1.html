<title>多益聽力與閱讀練習</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mut:#667085;--bd:#dcd9d0;--ac:#2f6fed;--ok:#1a7f4b;--okb:#e3f5ea;--no:#b42318;--nob:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--tx:#ececec;--mut:#9aa0aa;--bd:#383b42;--ac:#6b9bff;--ok:#5fd694;--okb:#16301f;--no:#ff8a80;--nob:#3a1d1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--tx:#ececec;--mut:#9aa0aa;--bd:#383b42;--ac:#6b9bff;--ok:#5fd694;--okb:#16301f;--no:#ff8a80;--nob:#3a1d1a;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.part{font-size:.8rem;color:var(--ac);font-weight:600}
.passage{background:var(--bg);border-left:3px solid var(--bd);padding:8px 12px;margin:8px 0;white-space:pre-line;font-family:Georgia,serif}
.q{margin:12px 0 4px;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.opt.right{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--nob);border-color:var(--no);color:var(--no)}
.exp{font-size:.9rem;color:var(--mut);margin:4px 0 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}
#res{font-weight:700}
.note{font-size:.8rem;color:var(--mut)}select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;max-width:100%}.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem}.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.ptabs button{padding:5px 10px;font-size:.85rem}.vnote{font-size:.8rem;color:var(--mut);margin:6px 0 0;min-height:1em}.ph{display:block;max-width:100%;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>🎧 多益聽力與閱讀練習</h1>
<div class="sub">題目為依多益（TOEIC L&amp;R）題型原創編寫的練習題，聽力由瀏覽器語音朗讀（建議使用 Chrome／Safari）。</div>
<div class="bar" style="margin:0 0 8px"><button class="pri" id="shf">🔀 隨機排序</button><button id="ord">↩ 原順序</button></div>
<div class="card ctl"><label>女聲 <select id="vW"></select></label><label>男聲 <select id="vM"></select></label><label>語速 <select id="rt"><option value="0.7">很慢</option><option value="0.8">慢</option><option value="0.9">稍慢</option><option value="1" selected>正常</option></select></label><button id="tst">試聽</button></div>
<div class="tabs"><button id="tL" class="on">聽力 Listening</button><button id="tR">閱讀 Reading</button></div>
<div class="ptabs" id="psub"></div>
<div class="card ctl" id="vctl" style="display:none"><label>類別 <select id="vc"></select></label><label>單字題數 <select id="vn"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="20">20 題</option></select></label><button class="pri" id="vgo">開始練習</button><span class="note">每次從單字庫隨機抽題，答完最後一題會自動顯示答案。</span></div>
<div id="app"></div>
<div class="bar"><button class="pri" id="chk">對答案</button><button id="rst">重新作答</button><span id="res"></span></div>
<p class="note">實際考試每段錄音只播放一次；此處可重複播放，想模擬考場請自己只聽一次。</p>
</main>

C('Part 3 簡短對話',[['M','Hello, I’m calling about the company dinner on the twentieth. We’d like to add five more guests.'],['W','Let me check. We can seat up to forty people in the private room. How many do you have now?'],['M','Thirty-two, so thirty-seven with the new guests.'],['W','That works. I’ll update the booking and send you the revised menu.']],[Q('Why is the man calling?',['To cancel a reservation','To add more guests','To change the menu','To ask for directions'],1,'add five more guests。'),Q('How many people can the private room seat?',['Thirty-two','Thirty-seven','Forty','Fifty'],2,'seat up to forty。'),Q('What will the woman send?',['A bill','A map','A revised menu','A coupon'],2,'send you the revised menu。')]),
C('Part 3 簡短對話',[['W','Thanks for coming in. Your résumé shows five years in marketing. Why do you want to join our company?'],['M','I admire your recent campaigns, and I’d like to work with a larger international team.'],['W','Great. Our team is hiring two people. We’ll contact you by Friday.']],[Q('What is the woman doing?',['Interviewing a candidate','Giving a tour','Selling a product','Teaching a class'],0,'談履歷與應徵動機，是面試。'),Q('What does the man say he wants?',['A higher salary','A shorter commute','To work with an international team','To change careers'],2,'larger international team。'),Q('When will the woman contact the man?',['Today','Tomorrow','By Friday','Next month'],2,'contact you by Friday。')]),

C('Part 3 簡短對話',[['W','Mr. Evans, our latest order of paper arrived with several damaged boxes.'],['M','I apologize. I’ll send a replacement shipment tomorrow at no extra charge.'],['W','Thank you. Should we return the damaged boxes?'],['M','No need. Just send me some photos by email for our records.']],[Q('Why is the woman calling?',['To report damaged goods','To place a new order','To ask for a discount','To change an address'],0,'貨品箱子受損。'),Q('What will the man do?',['Issue a refund','Send a replacement shipment','Visit the warehouse','Raise the price'],1,'send a replacement shipment。'),Q('What does the man ask the woman to send?',['A receipt','A new order form','Some photos','The damaged boxes'],2,'send me some photos。')]),

{s:'R',p:'Part 6 段落填空（二）',ps:'Dear Customers,\n\nThank you for choosing Harbor Café. Beginning next month, we will (1)______ our opening hours to serve you better. The café will open at 7 A.M. on weekdays. In addition, we are pleased to (2)______ a new seasonal menu featuring locally grown ingredients. (3)______ customers will receive a free coffee with any breakfast order during the first week. We look forward to seeing you.',qs:[Q('空格 (1)',['extend','extends','extending','extended'],0,'will 後接原形動詞。'),Q('空格 (2)',['introduce','introduction','introduced','introducing'],0,'be pleased to 後接原形動詞。'),Q('空格 (3)',['Regular','Regularly','Regularity','Regulate'],0,'形容詞修飾名詞 customers。')]},
{s:'R',p:'Part 6 段落填空（三）',ps:'To: All Employees\nFrom: Facilities Department\nSubject: Parking Lot Repairs\n\nThe east parking lot will be (1)______ for repairs from June 5 to June 9. During this time, employees are (2)______ to use the south lot or the public garage on Elm Street. The company will (3)______ parking fees at the garage for the period. (4)______ We apologize for any inconvenience.',qs:[Q('空格 (1)',['close','closed','closing','closure'],1,'will be + 過去分詞。'),Q('空格 (2)',['ask','asked','asking','asks'],1,'are asked to 被請求。'),Q('空格 (3)',['reimburse','reimbursed','reimbursing','reimbursement'],0,'will 後接原形動詞。'),Q('空格 (4)',['Please keep your receipts and submit them to the finance office.','The garage is open all year.','Repairs began last year.','The south lot is closed on Fridays.'],0,'承接前文報銷停車費，接收據說明。')]},
{s:'R',p:'Part 6 段落填空（四）',ps:'Dear Ms. Garcia,\n\nThank you for your inquiry about our conference services. Our event center can (1)______ up to 200 guests and includes a stage, a sound system, and free Wi-Fi. We also provide catering at a (2)______ rate for groups over fifty. To (3)______ a date, please send a deposit of 20 percent. (4)______',qs:[Q('空格 (1)',['accommodate','accommodation','accommodating','accommodated'],0,'can 後接原形動詞。'),Q('空格 (2)',['reduce','reduced','reducing','reduction'],1,'reduced rate 優惠價。'),Q('空格 (3)',['reserve','reserves','reserved','reserving'],0,'To + 原形動詞。'),Q('空格 (4)',['We look forward to hosting your event.','The stage was built last year.','Parking is not allowed.','Our office closes on Sundays.'],0,'信件結尾的客套語。')]},

{s:'R',p:'Part 7 閱讀理解（二）',ps:'From: Sandra Lee\nTo: Tom Reyes\nSubject: Delivery Delay\n\nDear Mr. Reyes,\n\nI am writing about your order #4482 of office chairs. Unfortunately, our supplier has informed us that the shipment will arrive three days later than planned, on June 14. We apologize for the inconvenience. As compensation, we will include a free set of desk organizers with your order. If you would prefer to cancel, please reply by June 10 and we will issue a full refund.',qs:[Q('Why did Ms. Lee write the email?',['To place an order','To report a delay','To request a payment','To offer a job'],1,'說明出貨延遲三天。'),Q('What will Mr. Reyes receive for free?',['A discount coupon','Extra chairs','Desk organizers','A gift card'],2,'free set of desk organizers。'),Q('What must Mr. Reyes do by June 10 if he wants to cancel?',['Return the chairs','Call the supplier','Reply to the email','Pay a fee'],2,'please reply by June 10。')]},
{s:'R',p:'Part 7 閱讀理解（三）',ps:'Café Lumen — Now Hiring!\n\nCafé Lumen, a popular coffee shop in the city center, is looking for part-time baristas. Applicants should be available for evening shifts, Monday through Friday. Previous experience is preferred but not required, as training will be provided. To apply, send your résumé to jobs@cafelumen.example by April 15. Selected applicants will be contacted for an interview.',qs:[Q('What is the purpose of the advertisement?',['To promote a new menu','To recruit part-time workers','To announce a closing','To sell equipment'],1,'looking for part-time baristas。'),Q('What is indicated about the job?',['It requires prior experience','Training is provided','It is for weekends only','It pays by the hour'],1,'training will be provided。'),Q('What should applicants do by April 15?',['Visit the café','Call the manager','Send a résumé','Attend an interview'],2,'send your résumé … by April 15。')]},
{s:'R',p:'Part 7 閱讀理解（四）',ps:'City Council Approves New Bike Lanes\n\nThe city council voted on Tuesday to add bike lanes along Riverside Avenue. Construction will begin in September and is expected to take three months. Council member Linda Park said the project would reduce traffic and improve safety. The project will cost 1.2 million dollars, which will be paid from the city’s transportation fund. Residents can share opinions at a public meeting on August 20.',qs:[Q('What is the article mainly about?',['A traffic accident','A plan for new bike lanes','A new bus route','A road closure'],1,'議會通過新增自行車道。'),Q('When will construction begin?',['In August','In September','In October','In December'],1,'begin in September。'),Q('How will the project be paid for?',['By a loan','By residents’ donations','From the transportation fund','By a private company'],2,'paid from the city’s transportation fund。'),Q('What can residents do on August 20?',['Vote on the plan','Attend a public meeting','Apply for a permit','Ride the bikes'],1,'share opinions at a public meeting。')]},
{s:'R',p:'Part 7 閱讀理解（五）',ps:'Notice to Tenants — Water Shutoff\n\nPlease be advised that water service to Building B will be shut off on Saturday, May 3, from 9 A.M. to 1 P.M. for pipe maintenance. Residents are encouraged to store enough water for drinking and cooking before the shutoff. Service will resume as soon as the work is completed. For questions, contact the building manager, Ms. Okafor, at extension 21.',qs:[Q('Why will water be shut off?',['To fix a leak in the roof','For pipe maintenance','To install a new heater','For a safety inspection'],1,'for pipe maintenance。'),Q('What are residents encouraged to do?',['Store water beforehand','Move out temporarily','Pay a fee','Call the city'],0,'store enough water … before the shutoff。'),Q('Who should be contacted with questions?',['A plumber','The city office','Ms. Okafor','A neighbor'],2,'contact the building manager, Ms. Okafor。')]},
{s:'R',p:'Part 7 閱讀理解（六）',ps:'From: Paul Nguyen\nTo: Design Team\nSubject: Schedule Change\n\nTeam,\nThe product review originally planned for Wednesday has been moved to Thursday at 2 P.M. because the client cannot attend earlier. Please update your calendars and finish your slides by Wednesday evening. If you have a conflict on Thursday, let me know by Tuesday.',qs:[Q('Why was the meeting moved?',['The client is unavailable earlier','A room is unavailable','The slides are not ready','Paul is traveling'],0,'the client cannot attend earlier。'),Q('When should the slides be finished?',['Tuesday morning','Wednesday evening','Thursday at 2 P.M.','Friday'],1,'finish your slides by Wednesday evening。'),Q('What should team members with a conflict do?',['Skip the meeting','Notify Paul by Tuesday','Send slides early','Ask the client'],1,'let me know by Tuesday。')]},
{s:'R',p:'Part 7 閱讀理解（七）',ps:'Bayside Furniture — Year-End Clearance\n\nEnjoy up to 50 percent off selected sofas, tables, and bookshelves from December 1 to December 15. Free delivery is available for orders over 300 dollars within the city. Sale items cannot be returned, but they may be exchanged within seven days. Visit our showroom on Harbor Road or shop online.',qs:[Q('What is being advertised?',['A repair service','A clearance sale','A job opening','A delivery app'],1,'Year-End Clearance 年終清倉。'),Q('What is true about delivery?',['It is free for orders over $300','It is available worldwide','It costs fifty dollars','It takes seven days'],0,'Free delivery … over 300 dollars。'),Q('What can customers do with sale items within seven days?',['Return them for a refund','Exchange them','Resell them','Trade them in'],1,'may be exchanged within seven days。')]},
{s:'R',p:'Part 7 閱讀理解（八）',ps:'Orion Tech Opens Second Office\n\nOrion Tech, a software company founded in 2016, announced the opening of its second office in Taichung. The new location will employ about 80 people, mainly engineers and customer support staff. CEO Ellen Wu said the expansion reflects growing demand for the company’s mobile payment app. The office will officially open on July 1.',qs:[Q('What is the article about?',['A company expansion','A merger','A product recall','A layoff'],0,'公司開設第二辦公室。'),Q('Who will work at the new office?',['Only managers','Sales trainees','Engineers and support staff','Part-time interns'],2,'mainly engineers and customer support staff。'),Q('What does Ellen Wu say?',['The app will be discontinued','Profits have fallen','Demand for the app is increasing','The company will move'],2,'growing demand for … app。')]},
{s:'R',p:'Part 7 閱讀理解（九）',ps:'To: All Staff\nFrom: Human Resources\n\nBeginning next month, employees may work from home up to two days per week with supervisor approval. Requests must be submitted through the online portal at least three days in advance. Employees working remotely are expected to be available during core hours, 10 A.M. to 3 P.M.',qs:[Q('What is the memo about?',['A salary increase','A new office','A remote-work policy','A hiring plan'],2,'work from home 與申請規定。'),Q('How should employees request remote work?',['By emailing HR','Through an online portal','By calling a supervisor','In person'],1,'submitted through the online portal。'),Q('What are remote workers expected to do?',['Attend every meeting','Report daily by phone','Be available during core hours','Work only on Fridays'],2,'available during core hours。')]},
{s:'R',p:'Part 7 閱讀理解（十）',ps:'Mia: Hi Jordan, did the client approve the new design?\nJordan: Almost. They want one change to the logo color.\nMia: Okay. Can you send the updated file by 4 P.M.? I need to print the banners tonight.\nJordan: Sure. I’ll email it as soon as I finish.',qs:[Q('What does the client want?',['A new logo color','A larger banner','A lower price','A different date'],0,'one change to the logo color。'),Q('Why does Mia need the file by 4 P.M.?',['To pay a bill','To print banners tonight','To meet the client','To update a website'],1,'print the banners tonight。'),Q('What will Jordan do?',['Call the client','Print the banners','Email the updated file','Visit the printer'],2,'I’ll email it。')]},
{s:'R',p:'Part 7 閱讀理解（十一）',ps:'Riverside Seminar — Saturday, October 12\n\n9:00 Registration\n9:30 Keynote: The Future of Remote Work\n11:00 Workshop A: Time Management / Workshop B: Team Communication\n12:30 Lunch (included)\n2:00 Panel Discussion\n\nAttendees must choose one workshop when registering. Parking is free for attendees.',qs:[Q('What happens at 9:30?',['Registration','A keynote speech','A panel discussion','Lunch'],1,'9:30 Keynote。'),Q('What is included?',['Transportation','Books','Lunch','A hotel room'],2,'Lunch (included)。'),Q('What must attendees do when registering?',['Pay for parking','Choose one workshop','Submit a résumé','Bring a laptop'],1,'choose one workshop when registering。')]},
{s:'R',p:'Part 7 閱讀理解（十二）',ps:'Dear Customer,\n\nThank you for your recent purchase of the AirPure air purifier. We are writing to confirm that your unit has shipped and should arrive within five business days. The filter should be replaced every six months. A replacement filter can be ordered at our website, and members receive a ten percent discount. Please register your product within thirty days to activate the warranty.',qs:[Q('What is the purpose of the message?',['To confirm a shipment','To request payment','To announce a recall','To offer a refund'],0,'your unit has shipped。'),Q('How often should the filter be replaced?',['Every month','Every three months','Every six months','Every year'],2,'replaced every six months。'),Q('What must customers do to activate the warranty?',['Pay a fee','Register the product','Call customer service','Replace the filter'],1,'register your product within thirty days。')]},
{s:'R',p:'Part 7 閱讀理解（十三）',ps:'Annual Charity Run\n\nThe Greenway Charity Run will take place on Sunday, April 6, beginning at 8 A.M. at Central Park. Participants can choose a 5-kilometer or 10-kilometer route. The registration fee is 20 dollars, and all proceeds will support local children’s programs. Participants who register before March 20 will receive a free T-shirt. Volunteers are also needed; contact the organizers for details.',qs:[Q('Where will the run be held?',['At a stadium','On Riverside Road','At Central Park','At a school'],2,'at Central Park。'),Q('What will the money support?',['Local children’s programs','A new stadium','Park maintenance','Medical research'],0,'support local children’s programs。'),Q('Who will get a free T-shirt?',['All volunteers','Anyone who registers before March 20','The 10-km winners','The first 100 runners'],1,'register before March 20。')]}

  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';
  u.rate=+document.getElementById('rt').value;u.pitch=(sp==='M'&&document.getElementById('vM').value==='r')?pt(key,'M'):1;u.volume=1;
  const v=pv(sp,key);
  if(v){u.voice=v;u.lang=v.lang}
  u.onend=()=>setTimeout(next,700);u.onerror=()=>setTimeout(next,300);
  speechSynthesis.speak(u);
 };
 next();
}
const SW={};
function speak(g,gi){let l=g.au;if(/^Part (1|2|4)/.test(g.p)&&!g.au.some(x=>/This is Julia/.test(x[1]))){if(SW[gi]===undefined)SW[gi]=Math.random()<.5;if(SW[gi])l=l.map(([s,t])=>[s==='W'?'M':'W',t])}say(l,gi)}
document.getElementById('tst').onclick=()=>{delete RV.test;say([['W','Hello. This is a test of the listening voice.'],['M','Can you hear me clearly?']],'test')};
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.play!==undefined){speak(G[b.dataset.play],b.dataset.play);return}
 if(b.dataset.k&&!D.has(+b.dataset.k.split('_')[0])){const gi0=+b.dataset.k.split('_')[0];A[b.dataset.k]=+b.dataset.o;autoV(gi0);render()}
});
function setSec(s){sec=s;sub='all';res.textContent='';buildSub();document.getElementById('tL').classList.toggle('on',s==='L');document.getElementById('tR').classList.toggle('on',s==='R');render()}
document.getElementById('tL').onclick=()=>setSec('L');
document.getElementById('tR').onclick=()=>setSec('R');
document.getElementById('chk').onclick=()=>{
 let t=0,r={L:[0,0],R:[0,0]};G.forEach((g,gi)=>{if(vis(g))D.add(gi)});
 G.forEach((g,gi)=>vis(g)&&g.qs.forEach((q,qi)=>{r[g.s][1]++;if(A[gi+'_'+qi]===q.a)r[g.s][0]++}));
 res.textContent='聽力 '+r.L[0]+'/'+r.L[1]+'　閱讀 '+r.R[0]+'/'+r.R[1]+'　合計 '+(r.L[0]+r.R[0])+'/'+(r.L[1]+r.R[1]);
 res.textContent=SUBN()+'　答對 '+(r.L[0]+r.R[0])+' / '+(r.L[1]+r.R[1])+' 題';render();
};
document.getElementById('rst').onclick=()=>{tok++;speechSynthesis.cancel();G.forEach((g,gi)=>{if(vis(g)){D.delete(gi);delete SW[gi];delete RV[gi];delete RP[gi];delete VN[gi];g.qs.forEach((q,qi)=>delete A[gi+'_'+qi])}});res.textContent='';render();window.scrollTo(0,0)};
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadV;loadV()}
buildSub();render();
</script>
